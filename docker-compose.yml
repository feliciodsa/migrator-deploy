services:
  migrator:
    image: ${MIGRATOR_IMAGE}
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
    networks:
      - supabase_net

  functions-sync:
    image: alpine/git:latest
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        rm -rf /tmp/repo &&
        git clone --depth 1 ${FUNCTIONS_REPO} /tmp/repo &&
        for d in /tmp/repo/supabase/code/volumes/functions/*/; do
          name=$$(basename "$$d");
          rm -rf "/target/$$name" && cp -r "$$d" "/target/$$name";
        done &&
        echo FUNCTIONS_SYNC_OK &&
        sleep 300
    volumes:
      - ${FUNCTIONS_HOST_PATH}:/target

networks:
  supabase_net:
    external: true
    name: ${SUPABASE_NETWORK}
